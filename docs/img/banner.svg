<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="mcp-picker: Escolha quais MCPs ativar nesta sessão">
  <defs>
    <radialGradient id="glow" cx="50%" cy="25%" r="75%">
      <stop offset="0" stop-color="#1e2a4a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8ef7"/><stop offset="0.5" stop-color="#8aa4ff"/><stop offset="1" stop-color="#3ecf8e"/>
    </linearGradient>
    <linearGradient id="hex" x1="2" y1="4" x2="30" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8ef7"/><stop offset="0.5" stop-color="#8aa4ff"/><stop offset="1" stop-color="#3ecf8e"/>
    </linearGradient>
    <marker id="seta" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 Z" fill="#8aa4ff"/>
    </marker>
  </defs>

  <rect width="1280" height="420" fill="#0d0f14"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <g transform="translate(80 44) scale(1.9)"><line x1="4" y1="9" x2="28" y2="9" stroke="#e9ecf4" stroke-width="2" stroke-linecap="round"/>
<circle cx="10" cy="9" r="3.5" fill="#4f8ef7"/>
<line x1="4" y1="16" x2="28" y2="16" stroke="#e9ecf4" stroke-width="2" stroke-linecap="round"/>
<circle cx="22" cy="16" r="3.5" fill="#3ecf8e"/>
<line x1="4" y1="23" x2="28" y2="23" stroke="#e9ecf4" stroke-width="2" stroke-linecap="round"/>
<circle cx="14" cy="23" r="3.5" fill="#8aa4ff"/>
</g>
  <text x="152" y="88" font-family="Montserrat, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#e9ecf4" letter-spacing="-0.5">mcp-picker</text>
  <circle cx="86" cy="140" r="5" fill="#3ecf8e"/>
  <text x="100" y="145" font-family="Montserrat, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#99a2b8" letter-spacing="1.4">PLUGIN CLAUDE CODE</text>
  <text x="80" y="205" font-family="Montserrat, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="51" fill="#ffffff" letter-spacing="-1.2">Escolha quais MCPs</text>
  <text x="80" y="265" font-family="Montserrat, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="51" fill="url(#acc)" letter-spacing="-1.2">ativar nesta sessão</text>
  <text x="80" y="305" font-family="Montserrat, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="19" fill="#99a2b8">Popup nativo antes do primeiro prompt.</text>
  <text x="80" y="331" font-family="Montserrat, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="19" fill="#99a2b8">Memória automática entre sessões.</text>
  <rect x="80" y="352" width="460" height="40" rx="12" fill="#090b10" stroke="#363e52" stroke-width="1.2"/>
  <text x="100" y="377" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" font-size="16" fill="#3ecf8e">$ /plugin install nathanramorim/mcp-picker</text>

  <rect x="760" y="62" width="480" height="318" rx="18" fill="#12151d" stroke="#252d40" stroke-width="1.5"/>
  <!-- Terminal header -->
<circle cx="785" cy="88" r="4" fill="#f2677a"/>
<circle cx="800" cy="88" r="4" fill="#f5b04a"/>
<circle cx="815" cy="88" r="4" fill="#3ecf8e"/>
<text x="830" y="92" font-family="'JetBrains Mono', monospace" font-size="10" fill="#667089">claude · forge-sdd</text>

<!-- Prompt line -->
<text x="777" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4f8ef7">❯</text>
<text x="791" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#99a2b8">claude</text>
<rect x="845" y="100" width="7" height="13" rx="1" fill="#4f8ef7" opacity="0.6"/>

<!-- Dialog box -->
<rect x="782" y="124" width="440" height="226" rx="8" fill="#0d0f14" stroke="#252d40" stroke-width="1.5"/>

<!-- Dialog header -->
<rect x="782" y="124" width="440" height="36" rx="8" fill="#1a1e29"/>
<rect x="782" y="144" width="440" height="16" fill="#1a1e29"/>
<text x="800" y="147" font-family="Montserrat, sans-serif" font-size="11" font-weight="600" fill="#e9ecf4">Quais MCPs ativar nesta sessão?</text>
<rect x="1157" y="130" width="52" height="18" rx="4" fill="#252d40"/>
<text x="1183" y="143" font-family="Montserrat, sans-serif" font-size="9" fill="#99a2b8" text-anchor="middle">MCPs</text>

<!-- Divider -->
<line x1="782" y1="160" x2="1222" y2="160" stroke="#252d40" stroke-width="1"/>

<!-- Option: Todos (selected) -->
<circle cx="802" cy="182" r="7" fill="none" stroke="#4f8ef7" stroke-width="2"/>
<circle cx="802" cy="182" r="4" fill="#4f8ef7"/>
<text x="818" y="187" font-family="Montserrat, sans-serif" font-size="12" font-weight="500" fill="#e9ecf4">Todos</text>

<!-- Option: Recentes (selected) -->
<circle cx="802" cy="208" r="7" fill="none" stroke="#3ecf8e" stroke-width="2"/>
<circle cx="802" cy="208" r="4" fill="#3ecf8e"/>
<text x="818" y="213" font-family="Montserrat, sans-serif" font-size="12" font-weight="500" fill="#e9ecf4">Recentes</text>

<!-- Option: Nenhum -->
<circle cx="802" cy="234" r="7" fill="none" stroke="#363e52" stroke-width="1.5"/>
<text x="818" y="239" font-family="Montserrat, sans-serif" font-size="12" fill="#667089">Nenhum</text>

<!-- Option: Escolher -->
<circle cx="802" cy="260" r="7" fill="none" stroke="#363e52" stroke-width="1.5"/>
<text x="818" y="265" font-family="Montserrat, sans-serif" font-size="12" fill="#667089">Escolher</text>

<!-- Bottom divider -->
<line x1="782" y1="278" x2="1222" y2="278" stroke="#252d40" stroke-width="1"/>

<!-- Status text -->
<text x="800" y="308" font-family="'JetBrains Mono', monospace" font-size="9" fill="#667089">22 de 22 MCPs ativos</text>

<!-- Enter button -->
<rect x="1118" y="291" width="84" height="26" rx="6" fill="#4f8ef7"/>
<text x="1160" y="308" font-family="Montserrat, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">↵ Enter</text>

</svg>
